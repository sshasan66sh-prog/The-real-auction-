<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7fb8ea">
<title>Cricket Auction</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏏</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#edf2ec;--card:#ffffff;--card2:#f3f7f1;--ink:#10231a;--muted:#587064;--line:#d3dfd3;
  --turf:#1f8a57;--turf-ink:#ffffff;--brass:#a97800;--brass-bg:#f3d77a;--brass-ink:#241a00;--red:#c9372c;--ok:#1f8a57;
  --board:#0a1512;--board-ink:#f3f7ef;--board-line:#1f3d31;--b-brass:#ecc14f;--b-red:#ff5a4d;--b-muted:#8fb0a0;
  --disp:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --ui:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#07120e;--card:#0f221a;--card2:#0b1c15;--ink:#eef5ea;--muted:#8fab9d;--line:#1f3d31;
    --turf:#3fbf80;--turf-ink:#04130c;--brass:#ecc14f;--brass-bg:#ecc14f;--brass-ink:#241a00;--red:#ff6a5c;--ok:#3fbf80;
    --board:#040a08;--board-line:#1a3328;
  }
}
:root[data-theme="dark"]{
  --bg:#07120e;--card:#0f221a;--card2:#0b1c15;--ink:#eef5ea;--muted:#8fab9d;--line:#1f3d31;
  --turf:#3fbf80;--turf-ink:#04130c;--brass:#ecc14f;--brass-bg:#ecc14f;--brass-ink:#241a00;--red:#ff6a5c;--ok:#3fbf80;
  --board:#040a08;--board-line:#1a3328;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--ui);min-height:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed}
h1,h2,h3,p{margin:0}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px 40px}
.shell{max-width:520px;margin:0 auto;padding:0 14px 110px}
.muted{color:var(--muted)}
.center{text-align:center}
small{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.card h2{font:800 26px/1 var(--disp);letter-spacing:.2px;margin-bottom:10px}
.card h3{font:700 15px/1.2 var(--ui);margin:0 0 8px}
.note{border-radius:12px;padding:10px 12px;margin:12px 0;background:var(--card2);border:1px solid var(--line);font-size:14px}
.note.warn{border-color:var(--red);color:var(--ink)}
.note.good{border-color:var(--ok)}
/* buttons */
.btn{min-height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;width:100%}
.btn.pri{background:var(--turf);color:var(--turf-ink);border-color:transparent}
.btn.gold{background:var(--brass-bg);color:var(--brass-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;width:auto;padding:0 12px;font-size:14px;border-radius:10px}
.btn.big{min-height:60px;font-size:20px}
.btn:disabled{opacity:.45}
.btn.danger{color:var(--red);border-color:var(--red)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row b{display:block}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=number],textarea{width:100%;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card2);padding:8px 12px;font-size:16px}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--turf);outline-offset:1px}
.inline{display:flex;gap:8px;align-items:flex-end}
.inline>*{min-width:0}
/* home */
.brand{padding:22px 4px 6px}
.brand h1{font:900 56px/.9 var(--disp);letter-spacing:.5px}
.brand p{margin-top:10px;color:var(--muted);max-width:30ch}
.stump{display:flex;gap:5px;margin-bottom:12px}
.stump i{width:7px;height:34px;border-radius:3px;background:var(--brass-bg)}
.stump i:nth-child(2){height:40px}
/* steppers, seg */
.step{display:flex;align-items:center;gap:6px}
.step button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:20px;font-weight:700}
.step button:disabled{opacity:.35}
.step span{min-width:54px;text-align:center;font:800 24px var(--disp)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;min-height:42px;border:0;background:var(--card2);font-weight:600;font-size:14px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--turf);color:var(--turf-ink)}
/* room code */
.code{font:900 54px/1 var(--disp);letter-spacing:6px;text-align:center;color:var(--brass);padding:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:14px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.chip button{border:0;background:none;color:var(--muted);font-size:16px;padding:0 0 0 2px}
.plist .prow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.plist .prow:first-child{border-top:0}
.plist .prow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .prow em{font:800 20px var(--disp);font-style:normal;color:var(--brass)}
.plist .prow button{border:0;background:none;color:var(--muted);font-size:20px;width:34px;height:34px}
.issues{margin:0 0 10px;padding-left:18px;color:var(--red);font-size:14px}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;background:var(--bg)}
.top b{font:800 22px/1 var(--disp)}
.top small{display:block;margin-top:2px}
.purse{text-align:right}
.purse b{color:var(--brass);font-size:30px}
/* lot scoreboard */
.lot{position:relative;overflow:hidden;border-radius:20px;padding:16px 16px 14px;margin:6px 0 12px;color:var(--board-ink);
  background:radial-gradient(120% 70% at 50% -15%,rgba(255,240,190,.26),transparent 62%),linear-gradient(180deg,#0e2019,var(--board));
  border:1px solid var(--board-line)}
.lot.extra{border-color:var(--b-red);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(255,90,77,.35)}}
.lotno{font-size:13px;color:var(--b-muted);display:flex;justify-content:space-between}
.pname{font:900 clamp(40px,13vw,58px)/.95 var(--disp);margin:8px 0 4px;word-break:break-word}
.base{color:var(--b-muted);font-size:14px}
.scoreboard{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px;gap:10px}
.scoreboard small{color:var(--b-muted)}
.price{font:900 92px/.85 var(--disp);color:var(--b-brass);display:flex;align-items:baseline;gap:4px}
.price i{font:700 24px var(--disp);font-style:normal;color:var(--b-muted)}
.clock{text-align:right}
#cd{font:900 62px/.9 var(--disp)}
.lot.extra #cd,.lot.extra #cl{color:var(--b-red)}
.segbar{height:12px;margin:12px 0 8px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.10) 0 8px,transparent 8px 11px)}
#bar{height:100%;width:100%;background:repeating-linear-gradient(90deg,var(--b-brass) 0 8px,transparent 8px 11px);transition:width .18s linear}
.lot.extra #bar{background:repeating-linear-gradient(90deg,var(--b-red) 0 8px,transparent 8px 11px)}
.leader{font-size:15px;min-height:22px}
.leader b{color:var(--b-brass)}
.stamp{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;
  background:rgba(4,10,8,.86);animation:slam .35s cubic-bezier(.2,1.4,.4,1) both}
@keyframes slam{from{transform:scale(1.5);opacity:0}to{transform:none;opacity:1}}
.stamp .big{font:900 74px/.9 var(--disp);color:var(--b-brass);transform:rotate(-4deg);border:5px solid var(--b-brass);padding:2px 18px;border-radius:8px}
.stamp.un .big{color:var(--b-muted);border-color:var(--b-muted)}
.stamp p{font-size:18px;font-weight:700;margin-top:12px}
.stamp small{color:var(--b-muted)}
/* bids */
.bids{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0 6px}
.bidbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:68px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:4px 0}
.bidbtn b{font:900 28px/1 var(--disp)}
.bidbtn span{font-size:12px;color:var(--muted)}
.bidbtn:not(:disabled){background:var(--brass-bg);border-color:transparent;color:var(--brass-ink)}
.bidbtn:not(:disabled) span{color:var(--brass-ink);opacity:.8}
.bidbtn:disabled{opacity:.4}
.bidbtn:not(:disabled):active{transform:translateY(1px)}
.hostbar{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}
.hostbar .btn{min-height:44px;padding:0 4px;font-size:13px}
.recent{font-size:14px;color:var(--muted)}
.recent div{padding:6px 0;border-top:1px solid var(--line)}
.recent b{color:var(--ink)}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
.tabs button{flex:1;max-width:170px;min-height:50px;border-radius:12px;border:0;background:transparent;font-weight:700;font-size:14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.tabs button span{font-size:18px}
.tabs button.on{background:var(--card2);color:var(--ink);box-shadow:inset 0 -3px 0 var(--brass)}
/* squad / xi */
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{min-width:0}
.col h3{display:flex;justify-content:space-between;align-items:baseline}
.col h3 small{font-weight:500}
.srow,.slot .sl{display:flex;align-items:center;gap:6px;width:100%;min-height:46px;padding:0 8px;border-radius:10px;border:1px solid var(--line);background:var(--card);text-align:left;margin-bottom:6px}
.srow i,.slot .sl i{font:800 15px var(--disp);font-style:normal;color:var(--muted);min-width:18px}
.srow span,.slot .sl span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:14px}
.srow em{font-style:normal;font-size:12px;color:var(--brass);font-weight:700}
.srow.used{opacity:.55}
.srow.used em::after{content:' XI'}
.srow.sel,.slot.sel .sl{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass) inset;background:var(--card2)}
.slot{display:flex;gap:4px;margin-bottom:6px}
.slot .sl{margin:0;flex:1}
.slot .sl.empty span{color:var(--muted);font-weight:500}
.slot .x{width:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:18px;color:var(--muted)}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.actions .btn{flex:1}
/* board */
.trow{border-top:1px solid var(--line);padding:10px 0}
.trow:first-child{border-top:0}
.thead{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:0}
.thead b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thead em{font:800 20px var(--disp);font-style:normal;color:var(--brass)}
.badge{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--card2);border:1px solid var(--line)}
.badge.bad{color:var(--red);border-color:var(--red)}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.tsq{margin:8px 0 0;padding-left:20px;font-size:14px;color:var(--muted)}
.tsq b{color:var(--ink);font-weight:600}
.pool .prow{display:flex;gap:8px;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.pool .prow:first-child{border-top:0}
.pool .prow span:last-child{color:var(--muted);text-align:right}
/* judging / results */
.jcard{text-align:center;padding:18px 14px}
.jcard .jt{font:800 22px var(--disp);color:var(--muted)}
.jcard .jn{font:900 clamp(38px,12vw,54px)/1 var(--disp);margin:6px 0}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.dots i.y{background:var(--brass-bg);border-color:var(--brass-bg)}
.dots i.n{background:var(--line)}
.dots i.now{border-color:var(--brass)}
.two-btn{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.win{text-align:center;padding:22px 14px;background:linear-gradient(180deg,var(--brass-bg),transparent 140%);border-color:var(--brass)}
.win .t{font:900 44px/1 var(--disp);color:var(--brass-ink)}
.win p{color:var(--brass-ink)}
.rank{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.rank:first-child{border-top:0}
.rank .n{font:900 24px var(--disp);width:26px;color:var(--muted)}
.rank b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank em{font:900 26px var(--disp);font-style:normal;color:var(--brass)}
.xilist{font-size:14px;margin:6px 0 0;padding-left:0;list-style:none}
.xilist li{display:flex;justify-content:space-between;padding:3px 0}
.xilist .y{color:var(--ok);font-weight:700}
.xilist .n{color:var(--muted)}
#toast{position:fixed;left:50%;transform:translate(-50%,-20px);top:calc(12px + env(safe-area-inset-top,0px));z-index:50;max-width:92vw;padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.2s}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.lot.extra{animation:none}.stamp{animation:none}#bar{transition:none}}

/* ===== Sky and Night themes ===== */
:root[data-theme="sky"],:root[data-theme="night"]{--disp:'Fraunces',Georgia,'Times New Roman',serif}
:root[data-theme="sky"]{--sky:linear-gradient(#7fb8ea 0%,#bfdcf3 38%,#e4f0f6 62%,#cfe6d2 100%);--bg:#cfe3f3;--card:rgba(255,255,255,.76);--card2:rgba(255,255,255,.55);--ink:#10263d;--muted:#4f6b85;--line:rgba(255,255,255,.8);--turf:#2f8f93;--turf-ink:#fff;--brass:#9a7222;--brass-bg:#e8c978;--brass-ink:#2a1f05;--red:#c7352b;--ok:#1d7f55;--board:#fff;--board-line:rgba(255,255,255,.85);--board-ink:#10263d;--b-brass:#9a7222;--b-red:#d1392d;--b-muted:#4f6b85;--lotbg:rgba(255,255,255,.82);--stampbg:rgba(255,255,255,.92);--seg:rgba(16,38,61,.13);--topbg:rgba(207,227,243,.88);--cloud:#fff;--grass:#5fa35a;--pitch:#d8b77a;--figure:#1f4f86;--stars:0}
:root[data-theme="night"]{--sky:linear-gradient(#08122b 0%,#14284f 45%,#223f6c 75%,#2c4a72 100%);--bg:#0e1b38;--card:rgba(18,34,66,.74);--card2:rgba(30,52,92,.6);--ink:#eaf1fb;--muted:#9bb3d1;--line:rgba(255,255,255,.14);--turf:#3aa6aa;--turf-ink:#041516;--brass:#e6c36a;--brass-bg:#e6c36a;--brass-ink:#2a1f05;--red:#ff7a6c;--ok:#4fd19b;--board:#0b1630;--board-line:rgba(255,255,255,.14);--board-ink:#eaf1fb;--b-brass:#e6c36a;--b-red:#ff7a6c;--b-muted:#9bb3d1;--lotbg:rgba(14,28,56,.8);--stampbg:rgba(8,18,40,.92);--seg:rgba(255,255,255,.14);--topbg:rgba(10,22,46,.88);--cloud:#9bb3d1;--grass:#14342a;--pitch:#5b4a30;--figure:#8fb4e6;--stars:.9}
body{background:var(--sky) fixed;color:var(--ink)}
#scene{position:fixed;inset:0;z-index:-1;pointer-events:none}
#scene svg{width:100%;height:100%;display:block}
#scene .cl ellipse{fill:var(--cloud);opacity:.55}
#scene .gr{fill:var(--grass)}#scene .pi{fill:var(--pitch)}#scene .cr{stroke:#fff;stroke-width:3;opacity:.8}
#scene .fg path{stroke:var(--figure);fill:none;stroke-linecap:round;opacity:.8}#scene .fg .h{fill:var(--figure);opacity:.8}
#scene .st circle{fill:#fff;opacity:var(--stars)}
.card,.tabs,.top,.sheet,.startbar{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.card{border-radius:22px;box-shadow:0 10px 30px rgba(15,50,100,.12)}
.card h2,.pname,.jn,.jcard .jt,.win .t,.brand h1,.stamp .big,.price,#cd,.xiclock b,.code,.sheet h3{font-family:var(--disp);font-weight:600}
.card h2::after{content:"";display:block;width:30px;height:2px;background:var(--brass);margin-top:8px}
.card h2 small{font-family:var(--ui)}.card h2 i{font-style:italic;font-weight:500}
.lot{background:var(--lotbg);border-color:var(--board-line);box-shadow:0 10px 30px rgba(15,50,100,.14)}
.price{font-size:84px}
.segbar{background:repeating-linear-gradient(90deg,var(--seg) 0 8px,transparent 8px 11px)}
.stamp{background:var(--stampbg)}
.top{display:block;background:var(--topbg);margin:0 -14px 6px;padding:8px 14px 6px}
.trow1,.trow2{display:flex;align-items:center;justify-content:space-between;gap:10px}
.trow2{margin-top:4px}
.wrap.home>.trow1{padding-top:10px}
.kicker{font:700 12px var(--ui);letter-spacing:.22em;color:var(--brass);display:flex;align-items:center;gap:8px}
.kicker::before{content:"";width:22px;height:2px;background:var(--brass)}
.tools{display:flex;gap:6px}
.tools button{min-width:38px;height:34px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:15px;padding:0 10px}
.tools .lv{font-weight:700;font-size:13px}
.wrap.lobbyhost{padding-bottom:140px}
.startbar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--topbg);border-top:1px solid var(--line)}
.startbar .issue{display:block;color:var(--red);margin:0 0 6px;font-size:13px}
.strip{display:flex;gap:8px;overflow-x:auto;margin:0 -14px 10px;padding:2px 14px 6px}
.tm{flex:none;min-width:132px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.tm.on{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.tm b{display:flex;align-items:center;gap:6px;white-space:nowrap}
.shade{position:fixed;inset:0;background:rgba(5,15,30,.5);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:520px;margin:0 auto;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--card);border-radius:24px 24px 0 0;display:flex;flex-direction:column;gap:10px}
.sheet h3{font-size:22px;margin:0}
.xiclock{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;margin:12px 0;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.xiclock b{font-size:40px;color:var(--brass)}
.btn.pri{box-shadow:0 6px 16px rgba(47,143,147,.28)}
</style>

<body>

<div id="app"></div>
<script>
(function(){
'use strict';
function createApp(root, claudeApi, opts){
opts = opts || {};
const LS = opts.lsKey || 'cricket-auction:last';
const GRACE = 600, RESULT_MS = 3200;
const COLORS = ['#e2483d','#e3b341','#3fb67a','#4aa3e8','#b07be8','#ef8a3c','#2fc4c4','#e86fa6'];
const SAMPLE = 'Virat Kohli 6\nBabar Azam 6\nJasprit Bumrah 5\nMitchell Starc 7\nShaheen Afridi 4\nRohit Sharma 6\nRashid Khan 5\nPat Cummins 5\nBen Stokes 4\nJos Buttler 5\nHardik Pandya 4\nMS Dhoni 4\nRishabh Pant 3\nFakhar Zaman 2\nMohammad Rizwan 4\nShadab Khan 2\nKane Williamson 3\nGlenn Maxwell 3\nSuryakumar Yadav 4\nRavindra Jadeja 3\nKL Rahul 3\nShubman Gill 3\nHaris Rauf 2\nNaseem Shah 2';

const S = {
  db:null, user:null, uid:null, canWrite:null, connecting:true,
  code:null, room:null, members:[], state:null, rx:0, judging:null,
  tab:'main', sel:null, myXI:null, myLocked:false, xiInit:false,
  form:{}, open:{}, judgeDoc:null, sheet:false, peek:null, un:[], bidUn:null, pendingBid:null, endAsk:false,
  lastStatus:null, lastKey:null, fullLobby:false, bidN:0
};
if (opts.prefillCode) S.form.code = opts.prefillCode;
root.innerHTML = '<div id="view"></div><div id="toast" aria-live="polite"></div>';
const V = root.querySelector('#view'), T = root.querySelector('#toast');

/* ---------- tiny helpers ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const ls = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
S.theme = ls.get('ca:theme') || 'sky'; S.sound = ls.get('ca:sound') !== '0';
document.documentElement.setAttribute('data-theme', S.theme);
let ac = null;
function audio(){ try{ if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); }catch(e){} return ac; }
function knock(t, v){
  const o = ac.createOscillator(), g = ac.createGain(), n = ac.createBuffer(1, Math.floor(ac.sampleRate * .05), ac.sampleRate), c = n.getChannelData(0), s = ac.createBufferSource(), g2 = ac.createGain();
  o.type = 'triangle'; o.frequency.setValueAtTime(190, t); o.frequency.exponentialRampToValueAtTime(55, t + .12);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + .2);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + .22);

  g2.gain.value = v * .6; s.buffer = n; s.connect(g2); g2.connect(ac.destination); s.start(t);
}
function hammer(sold){ if (!S.sound || !audio()) return; const t = ac.currentTime; knock(t, sold ? .9 : .4); if (sold) knock(t + .17, 1); }
const vib = p => { try{ if (S.sound && navigator.vibrate) navigator.vibrate(p); }catch(e){} };
function fx(p, n){
  if (!p || !n || !S.room) return;
  if (p.phase !== 'result' && n.phase === 'result' && n.last){ hammer(!!n.last.to); vib(n.last.to === S.uid ? [90,50,90,50,220] : n.last.to ? 60 : 0); }
  else if (n.phase === 'bidding' && p.cur && n.cur && p.cur.pid === n.cur.pid && p.cur.leader === S.uid && n.cur.leader && n.cur.leader !== S.uid) vib([40,40,40]);
}
let toastT = 0, lastToast = '';
function toast(m){ T.textContent = m; T.className = 'show'; clearTimeout(toastT); toastT = setTimeout(()=>{ T.className = ''; }, 2800); }
function onErr(e){
  console.error(e);
  const c = e && e.code;
  const m = (c === 'permission-denied' || c === 'invalid_argument') ? "Firebase blocked that save. Check the security rules from the setup guide." :
            (c === 'resource-exhausted' || c === 'quota_exceeded') ? "Firebase's free daily limit may be used up. Try again tomorrow." : 'Connection hiccup. Check your network.';
  if (m !== lastToast || !T.classList.contains('show')) toast(m);
  lastToast = m;
}
function genCode(){
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', r = new Uint32Array(5); crypto.getRandomValues(r);
  let s = ''; for (const x of r) s += A[x % A.length]; return s;
}
function uid8(){ const r = new Uint32Array(2); crypto.getRandomValues(r); return 'p' + r[0].toString(36) + r[1].toString(36).slice(0,3); }
function shuffle(a){
  a = a.slice(); const r = new Uint32Array(a.length); crypto.getRandomValues(r);
  for (let i = a.length - 1; i > 0; i--){ const j = r[i] % (i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function parseList(text){
  const out = [], bad = [];
  for (const raw of String(text).split(/\n|;/)){
    const line = raw.trim(); if (!line) continue;
    const m = line.match(/^(.*?)[\s,:\-–—=@]*?(\d+(?:\.\d+)?)\s*(?:cr|crore|crores|c)?\s*$/i);
    if (!m || !m[1].trim()){ bad.push(line); continue; }
    out.push({ id: uid8(), name: m[1].trim().slice(0,28), base: Math.max(1, Math.min(100, Math.round(parseFloat(m[2])))) });
  }
  return { out, bad };
}

/* ---------- derived data ---------- */
let _pmFor = null, _pm = {};
function pMap(){
  if (_pmFor !== S.room){ _pmFor = S.room; _pm = {}; for (const p of ((S.room && S.room.players) || [])) _pm[p.id] = p; }
  return _pm;
}
const cfg = () => S.room.cfg;
const iAmHost = () => !!(S.room && S.room.hostId === S.uid);
const me = () => S.members.find(m => m.uid === S.uid) || null;
const teamIdx = u => S.members.findIndex(m => m.uid === u);
const teamName = u => { const m = S.members.find(x => x.uid === u); return m ? m.team : 'A team'; };
const teamColor = u => COLORS[Math.max(0, teamIdx(u)) % COLORS.length];
const soldAll = () => (S.state && S.state.sold) || [];
const teamSold = u => soldAll().filter(x => x.to === u);
const soldCount = (st, u) => st.sold.filter(x => x.to === u).length;
const count = u => teamSold(u).length;
const purse = u => S.room.budget - teamSold(u).reduce((a,x) => a + x.price, 0);
const xiSize = () => Math.min(11, S.room.cfg.minSquad);
const xiLabel = () => xiSize() === 11 ? 'Playing XI' : 'Playing ' + xiSize();
const auctionOver = () => !!S.room && S.room.status !== 'lobby' && S.room.status !== 'auction';
const isDQ = u => auctionOver() && count(u) < cfg().minSquad;
const judgeUid = () => cfg().judgeMode === 'host' ? S.room.hostId : (cfg().judgeMode === 'friend' && S.judgeDoc ? S.judgeDoc.uid : null);
const amJudge = () => !!S.uid && judgeUid() === S.uid;

function maxBid(u){
  const c = cfg(), n = count(u); if (n >= c.maxSquad) return 0;
  const st = S.state, pm = pMap();
  const pool = [...(st.queue || []), ...(st.unsold || [])].map(id => pm[id] ? pm[id].base : null).filter(x => x != null).sort((a,b) => a - b);
  const needAfter = Math.max(0, c.minSquad - (n + 1));
  const reserve = pool.slice(0, needAfter).reduce((a,b) => a + b, 0);
  return purse(u) - reserve;
}
function anyEligible(){
  const c = S.state.cur;
  return S.members.some(m => count(m.uid) < cfg().maxSquad && maxBid(m.uid) >= c.base);
}
function finalXI(m){
  const size = xiSize(), squad = teamSold(m.uid).map(x => x.pid);
  let xi = [...new Set((m.xi || []).filter(id => id && squad.includes(id)))];
  for (const pid of squad){ if (xi.length >= size) break; if (!xi.includes(pid)) xi.push(pid); }
  return xi.slice(0, size);
}

/* ---------- coalescing writers (single writer per doc, newest wins) ---------- */
function writer(refFn){
  let pend = null, busy = false;
  return async function(data){
    pend = data; if (busy) return; busy = true;
    while (pend){ const d = pend; pend = null; try{ await refFn().set(d); }catch(e){ onErr(e); } }
    busy = false;
  };
}
const writeState = writer(() => S.db.doc('rooms/' + S.code + '/live/state'));
const writeRoom = writer(() => S.db.doc('rooms/' + S.code));
const writeJudging = writer(() => S.db.doc('rooms/' + S.code + '/live/judging'));
function commitState(n){ n.v = (S.state ? S.state.v : 0) + 1; fx(S.state, n); S.state = n; S.rx = performance.now(); rerender(); return writeState(n); }
function commitRoom(n){ n.v = (S.room.v || 0) + 1; S.room = n; rerender(true); return writeRoom(n); }
function commitJudging(n){ n.v = (S.judging ? S.judging.v : 0) + 1; S.judging = n; rerender(); return writeJudging(n); }
const memberRef = u => S.db.doc('rooms/' + S.code + '/members/' + u);
let saveT = 0;
function saveMine(now){
  clearTimeout(saveT);
  const go = () => { if (!me()) return; memberRef(S.uid).update({ xi: S.myXI, locked: S.myLocked }).catch(onErr); };
  if (now) go(); else saveT = setTimeout(go, 350);
}

/* ---------- host engine: the host's phone is the auctioneer ---------- */
const seen = {};
function newLot(st, pid){
  const p = pMap()[pid], ms = cfg().baseSec * 1000;
  st.cur = { pid, base: p.base, price: p.base, leader: null, bids: 0, extra: false };
  st.endsAt = Date.now() + ms; st.rem = ms; st.paused = false; st.phase = 'bidding';
  return st;
}
function startIssues(){
  const r = S.room, c = r.cfg, n = S.members.length, P = r.players.length, out = [];
  if (n < 1) out.push('Wait for at least one team to join.');
  if (P < 1) out.push('Add the players you want to auction.');
  if (n * c.minSquad > P) out.push(n + ' team' + (n === 1 ? '' : 's') + ' x ' + c.minSquad + ' minimum needs ' + (n * c.minSquad) + ' players. You have ' + P + '.');
  const cheapest = r.players.map(p => p.base).sort((a,b) => a - b).slice(0, c.minSquad).reduce((a,b) => a + b, 0);
  if (P >= c.minSquad && cheapest > r.budget) out.push('The ' + c.minSquad + ' cheapest players cost ' + cheapest + 'cr, over the ' + r.budget + 'cr budget.');
  if (c.judgeMode === 'friend' && !S.judgeDoc) out.push('Waiting for a friend to join as judge. Or pick Judge or No judge.');
  return out;
}
function hostStart(){
  if (!iAmHost() || startIssues().length) return;
  const ids = shuffle(S.room.players.map(p => p.id));
  const st = { phase:'bidding', paused:false, lot:1, round:1, queue:ids.slice(1), unsold:[], sold:[], total:ids.length, last:null, v:0 };
  S.state = null; newLot(st, ids[0]);
  commitState(st);
  const r = clone(S.room); r.status = 'auction'; commitRoom(r);
  S.tab = 'main'; wakeLock();
}
let wl = null;
function wakeLock(){ try{ if (navigator.wakeLock) navigator.wakeLock.request('screen').then(l => { wl = l; }).catch(()=>{}); }catch(e){} }

function xiTick(){
  const st = S.state, now = Date.now();
  if (st.xiPaused){ const n = clone(st); n.xiPaused = false; n.xiEnd = now + n.xiRem; return commitState(n); }
  const act = S.members.filter(m => !isDQ(m.uid));
  if (now >= st.xiEnd || !act.length || act.every(m => m.locked)) return cfg().judgeMode === 'none' ? finishNoJudge() : startJudging();
}
function hostTick(){
  if (!iAmHost() || !S.room || !S.state) return;
  if (S.room.status === 'xi') return xiTick();
  if (S.room.status !== 'auction') return;
  const st = S.state, now = Date.now(), extraMs = cfg().extraSec * 1000;
  if (st.phase === 'bidding'){
    if (st.paused) return;
    if (!st.cur.leader && !anyEligible()) return resolve(true);
    if (!st.cur.extra && now >= st.endsAt){
      const n = clone(st); n.cur.extra = true;
      n.endsAt = Math.max(st.endsAt + extraMs, now + 1000); n.rem = n.endsAt - now;
      return commitState(n);
    }
    if (st.cur.extra && now >= st.endsAt + GRACE) return resolve(false);
  } else if (st.phase === 'result' && now >= st.nextAt){
    return nextLot();
  }
}
function resolve(forceUnsold){
  const st = clone(S.state), c = st.cur;
  if (c.leader && !forceUnsold){
    st.sold.push({ pid:c.pid, to:c.leader, price:c.price });
    st.last = { pid:c.pid, to:c.leader, price:c.price };
  } else {
    st.unsold.push(c.pid);
    st.last = { pid:c.pid, to:null, price:c.base };
  }
  st.phase = 'result'; st.paused = false; st.nextAt = Date.now() + RESULT_MS;
  commitState(st);
}
function nextLot(){
  const st = clone(S.state), c = cfg();
  const full = S.members.length > 0 && S.members.every(m => soldCount(st, m.uid) >= c.maxSquad);
  let q = st.queue;
  if (!full && q.length === 0 && st.round === 1 && st.unsold.length && S.members.some(m => soldCount(st, m.uid) < c.minSquad)){
    q = shuffle(st.unsold); st.unsold = []; st.round = 2;
  }
  if (full || q.length === 0) return finishAuction(st);
  st.queue = q.slice(1); st.lot++;
  newLot(st, q[0]); commitState(st);
}
function finishAuction(st){
  const xs = (cfg().xiSec || 60) * 1000; st.phase = 'done'; st.xiRem = xs; st.xiEnd = Date.now() + xs; st.xiPaused = false; commitState(st);
  const r = clone(S.room); r.status = 'xi'; commitRoom(r);
}
function hostOnBid(u, b){
  if (!iAmHost() || !S.room || S.room.status !== 'auction') return;
  const st = S.state; if (!st || st.phase !== 'bidding' || st.paused) return;
  if (b.lot !== st.lot || b.pid !== st.cur.pid) return;
  if (seen[u] >= b.n) return;
  seen[u] = b.n;
  if (!S.members.some(m => m.uid === u)) return;
  const c = st.cur; if (c.leader === u) return;
  const t = Math.round(b.target), minOk = c.leader ? c.price + 1 : c.price;
  if (!(t >= minOk && t <= c.price + 5)) return;
  if (t > maxBid(u)) return;
  const n = clone(st), now = Date.now();
  n.cur.price = t; n.cur.leader = u; n.cur.bids++;
  if (n.cur.extra) n.endsAt = now + cfg().extraSec * 1000;
  n.rem = Math.max(0, n.endsAt - now);
  commitState(n);
}
function hostPause(){
  const n = clone(S.state), now = Date.now(); if (n.phase !== 'bidding') return;
  if (!n.paused){ n.rem = Math.max(0, n.endsAt - now); n.paused = true; } else { n.paused = false; n.endsAt = now + n.rem; }
  commitState(n);
}
function hostEnd(){
  const st = clone(S.state);
  if (st.phase === 'bidding' && st.cur.leader) st.sold.push({ pid:st.cur.pid, to:st.cur.leader, price:st.cur.price });
  else if (st.phase === 'bidding') st.unsold.push(st.cur.pid);
  finishAuction(st);
}

/* ---------- player: bidding ---------- */
function bidInfo(){
  const st = S.state, c = st.cur, m = me();
  if (!m) return { can:false, reason:"You're watching this auction." };
  if (st.phase !== 'bidding') return { can:false, reason:'Next player is coming up.' };
  if (st.paused) return { can:false, reason:'The host paused the auction.' };
  if (c.leader === S.uid) return { can:false, reason:'You hold the top bid. Wait for a rival.' };
  if (count(S.uid) >= cfg().maxSquad) return { can:false, reason:'Your squad is full.' };
  const mb = maxBid(S.uid);
  if (mb < c.base) return { can:false, reason:"You can't afford this player and still fill your minimum squad." };
  return { can:true, max:mb };
}
function bidLocked(){ const p = S.pendingBid; return !!(p && S.state && p.lot === S.state.lot && Date.now() - p.t < 900); }
function placeBid(t){
  const st = S.state; if (!st || !bidInfo().can || bidLocked()) return;
  const n = Math.max(S.bidN + 1, Date.now()); S.bidN = n;
  S.pendingBid = { lot:st.lot, t:Date.now() };
  S.db.doc('rooms/' + S.code + '/bids/' + S.uid).set({ n, lot:st.lot, pid:st.cur.pid, target:t, at:Date.now() }).catch(onErr);
  rerender(); setTimeout(rerender, 950);
}

/* ---------- squad and playing XI ---------- */
function ensureXI(){
  const n = xiSize(), squad = teamSold(S.uid).map(x => x.pid);
  let xi = Array.isArray(S.myXI) ? S.myXI.slice(0, n) : [];
  while (xi.length < n) xi.push(null);
  const used = new Set();
  S.myXI = xi.map(id => { if (!id || !squad.includes(id) || used.has(id)) return null; used.add(id); return id; });
}
function placeInSlot(pid, i){
  const xi = S.myXI, j = xi.indexOf(pid), old = xi[i];
  xi[i] = pid; if (j >= 0 && j !== i) xi[j] = old;
  saveMine();
}
function xiTapPlayer(pid){
  if (S.myLocked) return; ensureXI(); const s = S.sel;
  if (s && s.k === 's'){ placeInSlot(pid, s.i); S.sel = null; }
  else if (s && s.k === 'p' && s.id === pid){ S.sel = null; }
  else S.sel = { k:'p', id:pid };
  rerender();
}
function xiTapSlot(i){
  if (S.myLocked) return; ensureXI(); const s = S.sel, xi = S.myXI;
  if (s && s.k === 'p'){ placeInSlot(s.id, i); S.sel = null; }
  else if (s && s.k === 's'){ if (s.i !== i){ const t = xi[i]; xi[i] = xi[s.i]; xi[s.i] = t; saveMine(); } S.sel = null; }
  else if (xi[i]) S.sel = { k:'s', i };
  rerender();
}
function xiAuto(){
  if (S.myLocked) return; ensureXI();
  const used = new Set(S.myXI.filter(Boolean));
  for (const x of teamSold(S.uid)){ if (!used.has(x.pid)){ const i = S.myXI.indexOf(null); if (i < 0) break; S.myXI[i] = x.pid; used.add(x.pid); } }
  S.sel = null; saveMine(); rerender();
}

/* ---------- judging ---------- */
function startJudging(){
  const c = cfg();
  const teams = S.members.filter(m => count(m.uid) >= c.minSquad).map(m => ({ uid:m.uid, xi:finalXI(m) }));
  if (!teams.length) return finishNoJudge();
  const ju = judgeUid();
  let order = teams.filter(t => t.uid !== ju).map(t => t.uid);
  if (!order.length) order = teams.map(t => t.uid);
  S.judging = null;
  commitJudging({ teams, order, ti:0, pi:0, marks:{}, done:false, v:0 });
  const r = clone(S.room); r.status = 'judging'; commitRoom(r);
  S.tab = 'main';
}
function finishNoJudge(){ const r = clone(S.room); r.status = 'done'; commitRoom(r); S.tab = 'main'; }
function judgeStep(give){
  const j = clone(S.judging); if (!j || j.done) return;
  const tuid = j.order[j.ti], t = j.teams.find(x => x.uid === tuid);
  j.marks[tuid] = j.marks[tuid] || [];
  j.marks[tuid][j.pi] = give ? 1 : 0;
  j.pi++;
  if (j.pi >= t.xi.length){ j.ti++; j.pi = 0; if (j.ti >= j.order.length) j.done = true; }
  commitJudging(j);
}
function judgeUndo(){
  const j = clone(S.judging); if (!j) return;
  if (j.done){ j.done = false; j.ti = j.order.length - 1; j.pi = j.teams.find(x => x.uid === j.order[j.ti]).xi.length - 1; }
  else if (j.pi > 0) j.pi--;
  else if (j.ti > 0){ j.ti--; j.pi = j.teams.find(x => x.uid === j.order[j.ti]).xi.length - 1; }
  else return;
  const tuid = j.order[j.ti]; if (j.marks[tuid]) j.marks[tuid][j.pi] = null;
  commitJudging(j);
}
function computeResults(){
  const j = S.judging, c = cfg();
  const rows = S.members.map(m => ({ uid:m.uid, team:m.team, purse:purse(m.uid), n:count(m.uid), dq:count(m.uid) < c.minSquad, score:null, avg:false, xi:[], marks:[] }));
  if (j && j.teams){
    for (const row of rows){
      const t = j.teams.find(x => x.uid === row.uid); if (!t) continue;
      row.xi = t.xi; row.marks = (j.marks && j.marks[row.uid]) || [];
      if (j.order.includes(row.uid)) row.score = row.marks.reduce((a,x) => a + (x === 1 ? 1 : 0), 0);
    }
    const scored = rows.filter(x => x.score !== null);
    if (scored.length){
      const avg = Math.round(scored.reduce((a,x) => a + x.score, 0) / scored.length);
      for (const row of rows) if (!row.dq && row.score === null && j.teams.some(t => t.uid === row.uid)){ row.score = avg; row.avg = true; }
    }
  }
  const ranked = rows.filter(x => !x.dq && x.score !== null).sort((a,b) => b.score - a.score || b.purse - a.purse);
  const winners = ranked.length ? ranked.filter(x => x.score === ranked[0].score && x.purse === ranked[0].purse) : [];
  return { rows, ranked, winners };
}

function tickUI(){
  const xs = V.querySelectorAll('.xcd');
  if (xs.length && S.state && S.state.xiEnd){
    const s = S.state; let r = s.xiPaused ? s.xiRem : (iAmHost() ? s.xiEnd - Date.now() : s.xiRem - (performance.now() - S.rx));
    r = Math.max(0, Math.ceil(r / 1000)); const t = Math.floor(r / 60) + ':' + String(r % 60).padStart(2, '0'); xs.forEach(e => { e.textContent = t; });
  }
  const cd = V.querySelector('#cd'); if (!cd || !S.state || !S.room || !S.room.cfg) return;

/* ---------- room lifecycle ---------- */
function subBids(){
  if (S.bidUn || !S.db || !S.code) return;
  S.bidUn = S.db.collection('rooms/' + S.code + '/bids').onSnapshot(snap => {
    for (const ch of snap.docChanges()){ if (ch.type === 'removed') continue; const d = ch.doc.data(); if (d) hostOnBid(ch.doc.id, d); }
  }, onErr);
  S.un.push(S.bidUn);
}
function enterRoom(code){
  leaveRoom(true);
  S.code = code; ls.set(LS, code);
  const R = 'rooms/' + code;
  S.un.push(S.db.doc(R).onSnapshot(s => {
    if (!s.exists){ toast(S.gotRoom ? 'This room was closed.' : 'Room not found.'); return leaveRoom(); }
    const d = s.data(); S.gotRoom = true;
    if (S.room && (d.v || 0) <= (S.room.v || 0)) return;
    const prev = S.room ? S.room.status : null;
    S.room = d;
    if (iAmHost()) subBids();
    if (prev && prev !== d.status){
      if (d.status === 'xi' && me() && !isDQ(S.uid)) S.tab = 'squad';
      else S.tab = 'main';
      S.sel = null;
    }
    rerender(prev !== d.status);
  }, onErr));
  S.un.push(S.db.collection(R + '/members').onSnapshot(snap => {
    const all = snap.docs.map(d => d.data());
    S.members = all.filter(m => m.role !== 'judge').sort((a,b) => (a.joinedAt - b.joinedAt) || (a.uid < b.uid ? -1 : 1));
    S.judgeDoc = all.find(m => m.role === 'judge') || null;
    const mm = me(), jself = !!(S.judgeDoc && S.judgeDoc.uid === S.uid); if (jself) S.wasMember = true;
    if (mm){
      S.wasMember = true;
      if (!S.xiInit){ S.myXI = Array.isArray(mm.xi) ? mm.xi.slice() : []; S.myLocked = !!mm.locked; S.xiInit = true; }
    } else if (!jself && S.wasMember && S.room && S.room.status === 'lobby'){ toast('The host removed you from this room.'); return leaveRoom(); }
    rerender();
  }, onErr));
  S.un.push(S.db.doc(R + '/live/state').onSnapshot(s => {
    const d = s.exists ? s.data() : null; if (!d) return;
    if (S.state && (d.v || 0) <= S.state.v) return;
    fx(S.state, d); S.state = d; S.rx = performance.now(); rerender();
  }, onErr));
  S.un.push(S.db.doc(R + '/live/judging').onSnapshot(s => {
    const d = s.exists ? s.data() : null; if (!d) return;
    if (S.judging && (d.v || 0) <= S.judging.v) return;
    S.judging = d; rerender();
  }, onErr));
  rerender(true);
}
function leaveRoom(silent){
  for (const u of S.un){ try{ u(); }catch(e){} }
  S.un = []; S.bidUn = null;
  S.code = null; S.room = null; S.members = []; S.state = null; S.judging = null; S.judgeDoc = null; S.sheet = false; S.peek = null;
  S.myXI = null; S.myLocked = false; S.xiInit = false; S.wasMember = false; S.gotRoom = false;
  S.sel = null; S.tab = 'main'; S.lastKey = null; S.pendingBid = null; S.endAsk = false; S.closeAsk = false;
  for (const k in seen) delete seen[k];
  if (!silent){ ls.del(LS); rerender(true); }
}
async function createRoom(){
  if (!S.db) return toast("Live play isn't available in this view.");
  let code = null;
  try{
    for (let i = 0; i < 6; i++){ const c = genCode(); const s = await S.db.doc('rooms/' + c).get(); if (!s.exists){ code = c; break; } }
    if (!code) return toast('Could not make a free room code. Try again.');
    await S.db.doc('rooms/' + code).set({ code, hostId:S.uid, status:'lobby', v:1, createdAt:Date.now(), budget:100,
      cfg:{ maxTeams:4, minSquad:11, maxSquad:13, baseSec:10, extraSec:3, judgeMode:'host', judgeId:S.uid, xiSec:60 }, players:[] });
  }catch(e){ return onErr(e); }
  enterRoom(code);
}
async function joinRoom(){
  if (!S.db) return;
  const code = (S.form.code || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, ''), team = (S.form.team || '').trim().slice(0, 20);
  if (!code) return toast('Type the room code first.');
  try{
    const rs = await S.db.doc('rooms/' + code).get();
    if (!rs.exists) return toast('No room with that code.');
    const room = rs.data(), isHost = room.hostId === S.uid;
    const ms = await S.db.doc('rooms/' + code + '/members/' + S.uid).get();
    if (!ms.exists && !isHost){
      if (room.status === 'lobby'){
        const asJ = S.form.jrole === 'judge'; if (!team) return toast(asJ ? 'Type your name first.' : 'Pick a team name first.');
        const all = await S.db.collection('rooms/' + code + '/members').get();
        const ds = all.docs.map(d => d.data());
        if (asJ){ if (room.cfg.judgeMode !== 'friend') return toast('This room has no seat for a judge.'); if (ds.some(x => x.role === 'judge')) return toast('The judge seat is taken.'); }
        else if (ds.filter(x => x.role !== 'judge').length >= room.cfg.maxTeams) return toast('This room is full.');
        await S.db.doc('rooms/' + code + '/members/' + S.uid).set({ uid:S.uid, team, role:asJ ? 'judge' : 'team', joinedAt:Date.now(), xi:[], locked:false });
      } else toast('That auction already started. You can watch.');
    }

}
async function resume(){
  const code = ls.get(LS); if (!code || !S.db) return rerender(true);
  try{
    const s = await S.db.doc('rooms/' + code).get();
    if (!s.exists){ ls.del(LS); toast('That room is gone.'); return rerender(true); }
    enterRoom(code);
  }catch(e){ onErr(e); rerender(true); }
}
async function closeRoom(){
  const db = S.db, R = 'rooms/' + S.code;
  try{
    await db.doc(R).delete();
    const ms = await db.collection(R + '/members').get(); await Promise.all(ms.docs.map(d => db.doc(R + '/members/' + d.id).delete()));
    const bs = await db.collection(R + '/bids').get(); await Promise.all(bs.docs.map(d => db.doc(R + '/bids/' + d.id).delete()));
    await db.doc(R + '/live/state').delete(); await db.doc(R + '/live/judging').delete();
  }catch(e){ onErr(e); }
}

/* ---------- actions ---------- */
root.addEventListener('click', e => {
  if (S.sound) audio();
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  act(el.dataset.act, el);
});
root.addEventListener('input', e => { const n = e.target && e.target.name; if (n) S.form[n] = e.target.value; });
const LIM = { maxTeams:[1,8], minSquad:[1,15], maxSquad:[1,25], baseSec:[5,15], extraSec:[2,5], xiSec:[30,120] };
function act(a, el){
  const d = (el && el.dataset) || {}, host = iAmHost();
  switch (a){
    case 'invite': { const url = opts.inviteUrl(S.room.code), msg = 'Join my cricket auction. Room code ' + S.room.code;
      if (navigator.share) navigator.share({ title:'Cricket Auction', text:msg, url }).catch(() => {});
      else if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(() => toast('Invite link copied'), () => toast(url));
      else toast(url); return; }
    case 'resetfb': return opts.onReset && opts.onReset();
    case 'create': return createRoom();
    case 'join': return joinRoom();
    case 'resume': return resume();
    case 'leave': if (S.room){ S.sheet = true; return rerender(true); } return leaveRoom();
    case 'sheetx': S.sheet = false; return rerender(true);
    case 'leaveEnd': S.sheet = false; return host ? closeRoom() : undefined;
    case 'leaveGo': {
      S.sheet = false; const st = S.room && S.room.status;
      if (S.room && !host && st === 'lobby') memberRef(S.uid).delete().catch(onErr);
      if (host && S.state){
        if (st === 'auction' && S.state.phase === 'bidding' && !S.state.paused) hostPause();
        if (st === 'xi' && !S.state.xiPaused){ const n = clone(S.state); n.xiRem = Math.max(0, n.xiEnd - Date.now()); n.xiPaused = true; commitState(n); }
      }
      return leaveRoom();
    }
    case 'theme': S.theme = S.theme === 'night' ? 'sky' : 'night'; ls.set('ca:theme', S.theme); document.documentElement.setAttribute('data-theme', S.theme); return rerender(true);
    case 'sound': S.sound = !S.sound; ls.set('ca:sound', S.sound ? '1' : '0'); if (S.sound) audio(); return rerender(true);
    case 'jrole': S.form.jrole = d.r; return rerender(true);
    case 'peek': S.peek = S.peek === d.u ? null : d.u; return rerender();
    case 'copy': if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(S.room.code).then(() => toast('Code copied'), () => toast('Code: ' + S.room.code)); else toast('Code: ' + S.room.code); return;
    case 'tab': S.tab = d.t; S.sel = null; return rerender();
    case 'bd': S.open[d.u] = !S.open[d.u]; return rerender();
    case 'bid': return placeBid(+d.t);
    case 'sq': return xiTapPlayer(d.pid);
    case 'slot': return xiTapSlot(+d.i);
    case 'unslot': ensureXI(); S.myXI[+d.i] = null; S.sel = null; saveMine(); return rerender();
    case 'auto': return xiAuto();
    case 'clearxi': if (!S.myLocked){ S.myXI = Array(xiSize()).fill(null); S.sel = null; saveMine(); rerender(); } return;
    case 'lock': ensureXI(); if (S.myXI.filter(Boolean).length !== xiSize()) return toast('Fill every slot first.'); S.myLocked = true; S.sel = null; saveMine(true); return rerender();
    case 'unlock': if (S.room.status === 'xi'){ S.myLocked = false; saveMine(true); rerender(); } return;
    case 'jgive': if (amJudge() || host) judgeStep(true); return;
    case 'jskip': if (amJudge() || host) judgeStep(false); return;
    case 'jundo': if (amJudge() || host) judgeUndo(); return;
  }
  if (!host) return;
  switch (a){
    case 'hrole': {
      const r = clone(S.room), c = r.cfg;
      if (d.r === 'judge'){ c.judgeMode = 'host'; S.form.wantPlay = false; if (me()) memberRef(S.uid).delete().catch(onErr); }
      else { if (c.judgeMode === 'host') c.judgeMode = 'friend'; S.form.wantPlay = d.r === 'play'; if (d.r !== 'play' && me()) memberRef(S.uid).delete().catch(onErr); }
      return commitRoom(r);
    }
    case 'cfg': {
      const k = d.k, r = clone(S.room), c = r.cfg, l = LIM[k]; if (!l) return;
      c[k] = Math.min(l[1], Math.max(l[0], (c[k] || 60) + (+d.d) * (k === 'xiSec' ? 15 : 1)));
      if (k === 'minSquad' && c.maxSquad < c.minSquad) c.maxSquad = c.minSquad;
      if (k === 'maxSquad' && c.minSquad > c.maxSquad) c.minSquad = c.maxSquad;
      return commitRoom(r);
    }
    case 'jmode': {
      const r = clone(S.room), c = r.cfg; c.judgeMode = d.m;
      if (d.m === 'host') c.judgeId = S.uid; else if (d.m === 'none') c.judgeId = null; else if (!S.members.some(m => m.uid === c.judgeId)) c.judgeId = null;
      return commitRoom(r);
    }
    case 'jpick': { const r = clone(S.room); r.cfg.judgeId = d.u; return commitRoom(r); }
    case 'jtake': { const r = clone(S.room); r.cfg.judgeMode = 'host'; r.cfg.judgeId = S.uid; return commitRoom(r); }
    case 'kick': return void S.db.doc('rooms/' + S.code + '/members/' + d.u).delete().then(() => rerender(true)).catch(onErr);
    case 'hostplay': {
      const team = (S.form.hostteam || '').trim().slice(0, 20); if (!team) return toast('Type a team name first.');
      if (S.members.length >= cfg().maxTeams) return toast('Raise the team limit first.');
      return void memberRef(S.uid).set({ uid:S.uid, team, joinedAt:Date.now(), xi:[], locked:false }).then(() => rerender(true)).catch(onErr);
    }
    case 'addp': {
      const name = (S.form.pname || '').trim(); if (!name) return toast('Type a player name.');
      const base = Math.max(1, Math.min(100, parseInt(S.form.pbase, 10) || 1));
      const r = clone(S.room); if (r.players.length >= 100) return toast('Limit is 100 players.');
      r.players.push({ id:uid8(), name:name.slice(0, 28), base });
      S.form.pname = ''; S.focusSel = '#np-name'; return commitRoom(r);
    }
    case 'togglebulk': S.form.bulkOpen = !S.form.bulkOpen; return rerender(true);
    case 'bulk': {
      const { out, bad } = parseList(S.form.bulk || ''); if (!out.length) return toast('No valid lines. Try "Kohli 5cr".');
      const r = clone(S.room); r.players = r.players.concat(out).slice(0, 100);
      S.form.bulk = bad.join('\n'); if (!bad.length) S.form.bulkOpen = false;
      toast(out.length + ' added' + (bad.length ? ', ' + bad.length + ' line(s) skipped' : ''));
      return commitRoom(r);
    }
    case 'sample': { const r = clone(S.room); r.players = r.players.concat(parseList(SAMPLE).out).slice(0, 100); return commitRoom(r); }
    case 'delp': { const r = clone(S.room); r.players = r.players.filter(p => p.id !== d.id); return commitRoom(r); }
    case 'clearp': { const r = clone(S.room); r.players = []; return commitRoom(r); }
    case 'start': return hostStart();
    case 'pause': return hostPause();
    case 'hammer': if (S.state.phase === 'bidding' && S.state.cur.leader) resolve(false); return;
    case 'skip': if (S.state.phase === 'bidding') resolve(true); return;
    case 'endask': S.endAsk = true; rerender(); setTimeout(() => { S.endAsk = false; rerender(); }, 4000); return;
    case 'endyes': S.endAsk = false; return hostEnd();
    case 'startj': return startJudging();
    case 'finish': return finishNoJudge();
    case 'closeask': S.closeAsk = true; rerender(); setTimeout(() => { S.closeAsk = false; rerender(); }, 4000); return;
    case 'closeyes': return closeRoom();
  }
}

async function init(){
  render();
  try{ if (claudeApi && claudeApi.use){ S.db = await claudeApi.use('db'); S.user = await claudeApi.use('user'); } }catch(e){ console.error(e); }
  S.connecting = false;
  if (S.user){
    try{ S.uid = await S.user.id(); }catch(e){}
    try{ S.canWrite = await S.user.can('data.write'); }catch(e){}
  }
  if (!S.uid){ let a = ls.get(LS + ':anon'); if (!a){ a = 'anon_' + uid8(); ls.set(LS + ':anon', a); } S.uid = a; }
  if (S.db && ls.get(LS)) await resume(); else rerender(true);
}
init();
return { S, act, parseList, destroy(){ clearInterval(loop); leaveRoom(true); } };
}
window.CricketAuction = { createApp };
})();

/* ---------- Firebase boot: setup screen, anonymous sign-in, then start the game ---------- */
(function(){
'use strict';
if (window.__NO_AUTOSTART) return;
const KEY = 'cricket-auction:fbcfg';
const root = document.getElementById('app');
const lsGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet = (k, v) => { try{ localStorage.setItem(k, v); }catch(e){} };
const lsDel = k => { try{ localStorage.removeItem(k); }catch(e){} };
document.documentElement.setAttribute('data-theme', lsGet('ca:theme') || 'sky');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEYS = ['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId'];
function parseCfg(text){
  const cfg = {}, re = /["']?(apiKey|authDomain|projectId|storageBucket|messagingSenderId|appId|measurementId)["']?\s*:\s*["']([^"']+)["']/g;
  let m; while ((m = re.exec(String(text)))) cfg[m[1]] = m[2];
  return cfg;
}
const validCfg = c => !!(c && c.apiKey && c.projectId && c.appId);
const slim = c => { const o = {}; KEYS.forEach(k => { if (c[k]) o[k] = c[k]; }); return o; };
function readHash(){
  const out = {}, h = location.hash.replace(/^#/, ''); if (!h) return out;
  const p = new URLSearchParams(h);
  if (p.get('fb')){ try{ out.cfg = JSON.parse(atob(p.get('fb'))); }catch(e){} }
  if (p.get('room')) out.room = p.get('room').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
  return out;
}
function page(inner){ root.innerHTML = '<div class="wrap home">' + inner + '</div>'; }
function brand(title, text){ return '<div class="brand"><div class="stump"><i></i><i></i><i></i></div><h1>' + title + '</h1>' + (text ? '<p>' + text + '</p>' : '') + '</div>'; }

function showSetup(msg){
  page(brand('One-time<br>setup', 'Paste the Firebase web config for your project. You do this once. Then you can send friends an invite link that carries it for them.') +
    '<section class="card"><label for="cfg">Firebase web config</label><textarea id="cfg" placeholder="const firebaseConfig = {&#10;  apiKey: &quot;...&quot;,&#10;  projectId: &quot;...&quot;,&#10;  appId: &quot;...&quot;&#10;};"></textarea>' +
    (msg ? '<div class="note warn">' + esc(msg) + '</div>' : '') +
    '<div style="height:12px"></div><button class="btn pri" id="cfgsave">Save and start</button></section>');
  root.querySelector('#cfgsave').addEventListener('click', () => {
    const cfg = parseCfg(root.querySelector('#cfg').value);
    if (!validCfg(cfg)) return showSetup('That config is missing apiKey, projectId or appId. Copy the whole block from Project settings, Your apps.');
    lsSet(KEY, JSON.stringify(slim(cfg))); start(slim(cfg), null);
  });
}
function fail(msg){
  page(brand('Cannot<br>connect', '') + '<section class="card"><div class="note warn">' + esc(msg) + '</div>' +
    '<button class="btn pri" id="retry">Try again</button><div style="height:8px"></div><button class="btn" id="reset">Change Firebase project</button></section>');
  root.querySelector('#retry').addEventListener('click', () => location.reload());
  root.querySelector('#reset').addEventListener('click', () => { lsDel(KEY); location.reload(); });
}
function explain(e){
  const c = (e && e.code) || '';
  if (c === 'auth/operation-not-allowed' || c === 'auth/admin-restricted-operation') return 'Anonymous sign-in is switched off. In Firebase open Authentication, Sign-in method, turn on Anonymous, then try again.';
  if (c === 'auth/configuration-not-found') return 'Authentication is not set up yet. In Firebase open Authentication and tap Get started, then turn on Anonymous.';
  if (c === 'auth/invalid-api-key' || c === 'auth/api-key-not-valid.-please-pass-a-valid-api-key.') return 'That API key is not valid. Check the config you pasted.';
  if (c === 'auth/unauthorized-domain') return "This website is not allowed yet. In Firebase open Authentication, Settings, Authorized domains, and add this site's domain.";
  if (c === 'auth/network-request-failed' || c === 'unavailable') return 'No connection to Firebase. Check your internet and try again.';
  if (c === 'permission-denied') return 'Firestore is blocking access. Paste the security rules from the setup guide and tap Publish.';
  if (c === 'not-found' || c === 'failed-precondition') return 'The Firestore database does not exist yet. In Firebase open Firestore Database and tap Create database.';
  return 'Something went wrong: ' + (c || (e && e.message) || 'unknown error');
}
async function start(cfg, room){
  page(brand('Connecting', 'Signing in to your game server.'));
  if (!window.firebase) return fail('Could not load Firebase from the internet. Check your connection and reload.');
  let db, uid;
  try{
    if (!firebase.apps.length) firebase.initializeApp(cfg);
    const auth = firebase.auth();
    const existing = await new Promise(res => { const un = auth.onAuthStateChanged(u => { un(); res(u); }); });
    uid = existing ? existing.uid : (await auth.signInAnonymously()).user.uid;
    db = firebase.firestore();
    try{ db.settings({ experimentalAutoDetectLongPolling:true, merge:true }); }catch(e){}
    await db.doc('rooms/_probe').get();
  }catch(e){ console.error(e); return fail(explain(e)); }
  const shim = { use: async n => n === 'db' ? db : n === 'user' ? { id: async () => uid, can: async () => true, isOwner: async () => false, canEdit: async () => false } : null };
  root.innerHTML = '';
  window.CricketAuction.createApp(root, shim, {
    lsKey: 'cricket-auction:' + cfg.projectId, prefillCode: room,
    onReset(){ lsDel(KEY); location.reload(); },
    inviteUrl(code){ return location.href.split('#')[0] + '#fb=' + encodeURIComponent(btoa(JSON.stringify(slim(cfg)))) + '&room=' + code; }
  });
}
const hash = readHash();
let cfg = null;
if (hash.cfg && validCfg(hash.cfg)){ cfg = slim(hash.cfg); lsSet(KEY, JSON.stringify(cfg)); }
else { try{ const s = lsGet(KEY); if (s) cfg = JSON.parse(s); }catch(e){} }
if (hash.cfg || hash.room){ try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){} }
if (!validCfg(cfg)) showSetup(); else start(cfg, hash.room || null);
})();
</script>
